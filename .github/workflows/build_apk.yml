name: Build Flutter APK with Custom Logo

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Create project & setup launcher icons
      run: |
        flutter create . --org com.ecommerce --project-name ecommerce_app --platforms android,ios
        mkdir -p assets
        
        # Create a basic text icon or dummy image for launcher icons package
        echo '<svg height="512" width="512" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="blue"/><text x="50%" y="55%" font-size="220" font-family="Arial" fill="white" dominant-baseline="middle" text-anchor="middle">TN</text></svg>' > assets/icon.svg
        
        # Using a reliable way to get a PNG or standard setup
        flutter pub add flutter_launcher_icons
        
        mkdir -p lib
        echo 'import "package:flutter/material.dart"; void main() => runApp(const MyApp()); class MyApp extends StatelessWidget { const MyApp({super.key}); @override Widget build(BuildContext context) { return MaterialApp(home: Scaffold(appBar: AppBar(title: const Text("TN Super App")), body: const Center(child: Text("Wallet & Escrow Ready")))); } }' > lib/main.dart

    - run: flutter pub get

    - run: flutter build apk --release

    - uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        
